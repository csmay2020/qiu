.btn-p:disabled{background:#2A3654;color:#54678C;cursor:not-allowed}
.btn-s{padding:6px 12px;border-radius:8px;border:1px solid #1E2A44;background:transparent;color:#8CA0C0;font-size:12px;cursor:pointer}
.btn-s.small{font-size:11px;padding:4px 10px}
.gold{color:#F5B841;border-color:#F5B841!important}
.red{color:#F87171;border-color:#F87171!important}
.green{color:#34D399;border-color:#34D399!important}
.blue{color:#6FA8F5;border-color:#6FA8F5!important}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;background:#0D1424;border-bottom:1px solid #1E2A44;position:sticky;top:0;z-index:5}
.tab-btn{flex:1;padding:13px 0;font-size:13px;color:#54678C;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tab-btn.on{color:#F5B841;font-weight:800;border-bottom-color:#F5B841}
.erow{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr 1fr;gap:6px;align-items:center;padding:9px 6px;border-bottom:1px solid #25335280}
.ebar{width:50px;height:5px;background:#0E1626;border-radius:3px;position:relative;overflow:hidden;display:inline-block}
.num{font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace}
.slip{background:linear-gradient(160deg,#182543,#121B2E);border:1px solid #F5B84155;border-radius:14px;padding:18px;margin:16px 0 6px;position:relative;overflow:hidden}
.slip-bar{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#F5B841,transparent)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:#0E1626;border-radius:10px;padding:14px 10px;text-align:center;border:1px solid #1E2A44}

function lookupCorners(league, home, away){
  var db = CORNER_DB[league];
  if(!db) return null;
  function findTeam(name){
    if(!name) return null;
    var n = name.trim();
    if(db[n] !== undefined) return {team:n, avg:db[n]};
    var lower = n.toLowerCase();
    var keys = Object.keys(db);
    for(var i=0;i<keys.length;i++){
      if(keys[i].toLowerCase() === lower) return {team:keys[i], avg:db[keys[i]]};
    }
    for(var j=0;j<keys.length;j++){
      if(keys[j].toLowerCase().indexOf(lower) >= 0 || lower.indexOf(keys[j].toLowerCase()) >= 0)
        return {team:keys[j], avg:db[keys[j]]};
    }
    return null;
  }
  var h = findTeam(home), a = findTeam(away);
  if(!h && !a) return null;
  return {home:h, away:a, total:(h?h.avg:0)+(a?a.avg:0)};
}

function getMarketType(marketName){
  var m = (marketName||"").toLowerCase();
  if(m.indexOf("角球") >= 0 || m.indexOf("corner") >= 0) return "corners";
  if((m.indexOf("大") >= 0 || m.indexOf("小") >= 0 || m.indexOf("over") >= 0 || m.indexOf("under") >= 0) && (m.indexOf("球") >= 0 || m.indexOf("goal") >= 0)) return "over_under";
  return "default";
}
function getEdgeThreshold(marketName){ return EDGE_THRESHOLD[getMarketType(marketName)] || EDGE_THRESHOLD.default; }

function pct(x){ return (x == null || isNaN(x)) ? "—" : (x * 100).toFixed(1) + "%"; }

function compressImage(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var MAX = 1568, w = img.width, h = img.height, sc = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        var url = cv.toDataURL('image/jpeg', 0.85);
        resolve({ b64: url.split(',')[1], type: 'image/jpeg', preview: url });
      };
      img.src = e.target.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function edgeColor(e, type){
  if(e == null) return '#54678C';
  var threshold = EDGE_THRESHOLD[type] || EDGE_THRESHOLD.default;
  if(e > threshold * 1.5) return '#34D399';
  if(e > threshold) return '#F5B841';
  if(e > 0) return '#FB923C';
  return '#F87171';
}

// 1. iOS OCR Server
async function ocrIOS(base64Image, serverUrl) {
  try {
    console.log('[iOS OCR] 请求开始...');
    var blobRes = await fetch(base64Image);
    var blob = await blobRes.blob();
    var formData = new FormData();
    formData.append('file', blob, 'screenshot.png');
    var resp = await fetch(serverUrl + '/upload', { method: 'POST', body: formData });
    console.log('[iOS OCR] HTTP状态:', resp.status);
    var text = await resp.text();
    console.log('[iOS OCR] 原始响应:', text.slice(0, 300));
    var result;
    try { result = JSON.parse(text); } catch(e) {
      if (text.trim().length > 10) return text.trim();
      return '';
    }
    if (result.success && result.ocr_result) return result.ocr_result || '';
    if (result.text) return result.text;
    if (result.result) return result.result;
    if (result.data && result.data.text) return result.data.text;
    if (typeof result === 'string') return result;
    return '';
  } catch(e) {
    console.error('[iOS OCR] 异常:', e);
    return '';
  }
}

// 2. Tesseract.js
async function ocrTesseract(base64Image) {
  try {
    console.log('[Tesseract] 开始识别...');
    var result = await Tesseract.recognize(base64Image, 'eng');
    console.log('[Tesseract] 识别完成，置信度:', result.data.confidence);
    return result.data.text || '';
  } catch(e) {
    console.error('[Tesseract] 异常:', e);
    return '';
  }
}

// 3. OCR.space（新增）
async function ocrSpace(base64Image, apiKey) {
  if (!apiKey) {
    console.warn('[OCR.space] 缺少 API Key');
    return '';
  }
  try {
    console.log('[OCR.space] 开始识别...');
    var blobRes = await fetch(base64Image);
    var blob = await blobRes.blob();
    var formData = new FormData();
    formData.append('file', blob, 'screenshot.png');
    formData.append('apikey', apiKey);
    formData.append('language', 'eng');
    formData.append('OCREngine', '2');

    var resp = await fetch('https://api.ocr.space/parse/image', {
      method: 'POST',
      body: formData
    });
    console.log('[OCR.space] HTTP状态:', resp.status);

    if (!resp.ok) {
      var errText = await resp.text();
      console.error('[OCR.space] 请求失败:', resp.status, errText);
      return '';
    }

    var result = await resp.json();
    console.log('[OCR.space] API返回码:', result.OCRExitCode);

    if (result.OCRExitCode === 1 && result.ParsedResults && result.ParsedResults.length > 0) {
      var text = result.ParsedResults[0].ParsedText || '';
      console.log('[OCR.space] 识别成功，文本长度:', text.length);
      return text;
    } else {
      console.error('[OCR.space] 识别失败:', result.ErrorMessage);
      return '';
    }
  } catch(e) {
    console.error('[OCR.space] 异常:', e);
    return '';
  }
}

// 主 OCR 路由
async function recognizeImageWithOCR(base64Image) {
  var engine = ST.ocrEngine;
  console.log('[OCR] 使用引擎:', engine);
  switch(engine) {
    case 'ios':
      return await ocrIOS(base64Image, ST.iosUrl);
    case 'tesseract':
      return await ocrTesseract(base64Image);
    case 'ocrspace':
      return await ocrSpace(base64Image, ST.ocrspaceKey);
    default:
      return '';
  }
}

// =====================================================================
// JSON 解析
// =====================================================================
function extractJSON(data) {
  var text = (data.content || [])
    .filter(function(b){ return b.type === 'text'; })
    .map(function(b){ return b.text; })
    .join('\n')
    .replace(/```json|```/g, '')
    .trim();

  console.log('[JSON] 原始长度:', text.length);

  var start = text.indexOf('{');
  var end = text.lastIndexOf('}');
  if (start === -1 || end === -1 || end <= start) {
    throw new Error('NO_JSON: 未找到JSON对象。片段:' + text.slice(0, 300));
  }

  var jsonStr = text.slice(start, end + 1);

  jsonStr = jsonStr.replace(/,\s*}/g, '}');
  jsonStr = jsonStr.replace(/,\s*\]/g, ']');
  jsonStr = jsonStr.replace(/([{,]\s*)(\w+)(\s*:)/g, '$1"$2"$3');

  try {
    return JSON.parse(jsonStr);
  } catch (e) {
    var posMatch = e.message.match(/position (\d+)/);
    if (posMatch) {
      var pos = parseInt(posMatch[1]);
      var snippet = jsonStr.slice(Math.max(0, pos - 40), Math.min(jsonStr.length, pos + 40));
      console.error('[JSON] 解析失败位置:', snippet);
    }
    console.error('[JSON] 完整内容:', jsonStr.slice(0, 500) + '...');
    throw new Error('JSON解析失败: ' + e.message + '。请重试。');
  }
}

// =====================================================================
// DeepSeek API
// =====================================================================
async function callDeepSeek(messages, apiKey) {
  var body = {
    model: 'deepseek-v4-pro',
    messages: messages,
    max_tokens: 24000,
    temperature: 0.3
  };
  var resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey.trim()
    },
    body: JSON.stringify(body)
  });
  var raw = await resp.text();
  var data;
  try { data = JSON.parse(raw); } catch(e) {
    throw new Error('HTTP '+resp.status+', 非JSON回复:'+raw.slice(0,200));
  }
  if(data.error){ throw new Error(data.error.message || JSON.stringify(data.error)); }
  if(!data.choices || !data.choices[0]){ throw new Error('无回复内容'); }
  
  return {
    content: [{ type: 'text', text: data.choices[0].message.content }],
    stop_reason: data.choices[0].finish_reason || 'stop'
  };
}

async function runAnalysis(params, dsKey) {
  var prompt = buildPrompt(params);
  var content = [{ type: 'text', text: prompt }];
  var messages = [{ role: 'user', content: content }];
  var data = await callDeepSeek(messages, dsKey);
  if (data.stop_reason === 'length') {
    throw new Error('输出被截断，请重试（token限制已增加）');
  }
  return extractJSON(data);
}

  document.getElementById('results-area').style.display = 'none';

  var creditDisplay = document.getElementById('credit-display');

      var results = await Promise.all(ST.images.map(function(img){ return recognizeImageWithOCR(img.preview); }));
      ocrCombinedText = results.filter(function(t){ return t.trim(); }).join('\n---\n');
      if(!ocrCombinedText || ocrCombinedText.trim().length < 10){
        alert('⚠️ OCR识别失败，请切换到「文字粘贴」模式手动输入。');
        statusEl.style.display = 'none';
        btn.disabled = false; btn.textContent = '开始分析';
        ST.busy = false;
        return;

    }
    var finalOddsText = ST.oddsMode === 'txt' ? getField('odds') : ocrCombinedText;

    // ── Tavily 搜索 ──
    statusEl.textContent = '🔎 搜索比赛信息（Tavily）…';
    var searchQueries = [
      home + ' vs ' + away + ' head to head',
      home + ' injuries team news',
      away + ' injuries team news',
      home + ' recent form',
      away + ' recent form',
      home + ' average corners per game',
      away + ' average corners per game',
      home + ' corners stats',
      away + ' corners stats',
      home + ' goals per game home',
      away + ' goals per game away',
      home + ' over 2.5 percentage',
      away + ' over 2.5 percentage'

      }
      if (data.results && data.results.length > 0) {

          searchContext += (idx+1) + '. ' + (r.title || '') + '\n   ' + (r.content || '') + '\n';

      }

    ST.busy = false;
    statusEl.style.display = 'none';
  }
}

// ── 自动记入验证 ──
function autoAddVerify(r, home, away){
  if(!r) return;
  var pr = r.probs || {};
  var pred_1x2 = pr.home > pr.away ? (pr.home > pr.draw ? 'home' : 'draw') : (pr.away > pr.draw ? 'away' : 'draw');
  var entry = {
    id: Date.now(),
    date: new Date().toISOString().slice(0,10),
    league: ST.league,
    match: home + ' vs ' + away,
    pred_1x2: pred_1x2,
    pred_score: r.predicted_score || '',
    pred_over25: r.goals && r.goals.over25 >= 0.5 ? 'over' : 'under',
    pred_corners_total: r.corners && r.corners.exp_total != null ? r.corners.exp_total : null,
    actual_score: null,
    actual_corners: null,
    actual_1x2: null,
    actual_over25: null,
    correct_1x2: null,
    correct_score: null,
    correct_over25: null,
    correct_corners: null
  };
  var existingIdx = -1;
  for(var i=0;i<ST.verify.length;i++){
    if(ST.verify[i].match === entry.match && ST.verify[i].date === entry.date && ST.verify[i].league === entry.league){
      existingIdx = i;
      break;
    }
  }
  if(existingIdx >= 0){
    ST.verify[existingIdx] = {
      ...ST.verify[existingIdx],
      pred_1x2: entry.pred_1x2,
      pred_score: entry.pred_score,
      pred_over25: entry.pred_over25,
      pred_corners_total: entry.pred_corners_total
    };
  } else {
    ST.verify.unshift(entry);
  }
  saveVerify(ST.verify);
  if(ST.tab === 'verify') refreshVerify();
}

function recordBet(){
  var r = ST.result; if(!r || !r.rec) return;
  var home = getField('home'), away = getField('away');
  var main = r.rec.main || {};
  if(!main.dir) return;
  var entry = {
    id: Date.now(),
    date: new Date().toISOString().slice(0,10),
    league: ST.league,
    match: home + ' vs ' + away,
    market: 'Full Time',
    sel: main.dir,
    odds: main.odds || null,
    p: main.prob || null,
    stake: parseFloat((r.rec.stake||'').replace(/[^0-9.]/g,'')) || 5,
    ret: null,
    result: 'pending'
  };
  ST.log.unshift(entry); saveLog(ST.log); switchTab('log'); refreshLog();
}

function saveActual(id, score, corners){
  var actual_1x2 = null;
  var parts = (score || '').split('-');
  var hg = parseInt(parts[0]), ag = parseInt(parts[1]);
  if(!isNaN(hg) && !isNaN(ag)){
    actual_1x2 = hg > ag ? 'home' : (hg < ag ? 'away' : 'draw');
  }
  var actual_over25 = (!isNaN(hg) && !isNaN(ag)) ? (hg + ag > 2.5 ? 'over' : 'under') : null;
  var actual_corners_val = parseInt(corners);

  ST.verify = ST.verify.map(function(v){
    if(v.id !== id) return v;
    var correct_1x2 = (actual_1x2 && v.pred_1x2 === actual_1x2) ? true : (actual_1x2 ? false : null);
    var correct_score = (score && v.pred_score === score) ? true : (score ? false : null);
    var correct_over25 = (actual_over25 && v.pred_over25 === actual_over25) ? true : (actual_over25 ? false : null);
    var correct_corners = null;
    if(!isNaN(actual_corners_val) && v.pred_corners_total != null){
      correct_corners = Math.abs(actual_corners_val - v.pred_corners_total) <= 1.5;
    }
    return {
      ...v,
      actual_score: score || null,
      actual_corners: isNaN(actual_corners_val) ? null : actual_corners_val,
      actual_1x2: actual_1x2,
      actual_over25: actual_over25,
      correct_1x2: correct_1x2,
      correct_score: correct_score,
      correct_over25: correct_over25,
      correct_corners: correct_corners
    };
  });
  saveVerify(ST.verify);
  refreshVerify();
}

function delVerify(id){
  ST.verify = ST.verify.filter(function(v){ return v.id !== id; });
  saveVerify(ST.verify);
  refreshVerify();
}

function resetVerify(id){
  ST.verify = ST.verify.map(function(v){
    if(v.id !== id) return v;
    return {
      ...v,
      actual_score: null,
      actual_corners: null,
      actual_1x2: null,
      actual_over25: null,
      correct_1x2: null,
      correct_score: null,
      correct_over25: null,
      correct_corners: null
    };
  });
  saveVerify(ST.verify);
  refreshVerify();
}

function refreshVerify(){
  var area = document.getElementById('verify-area');
  var statsArea = document.getElementById('verify-stats');
  if(!area) return;

  var settled = ST.verify.filter(function(v){ return v.actual_1x2 !== null || v.actual_score !== null; });
  var stats = { c1x2: 0, t1x2: 0, cscore: 0, tscore: 0, co25: 0, to25: 0, ccorners: 0, tcorners: 0 };

  settled.forEach(function(v){
    if(v.correct_1x2 !== null){ stats.t1x2++; if(v.correct_1x2) stats.c1x2++; }
    if(v.correct_score !== null){ stats.tscore++; if(v.correct_score) stats.cscore++; }
    if(v.correct_over25 !== null){ stats.to25++; if(v.correct_over25) stats.co25++; }
    if(v.correct_corners !== null){ stats.tcorners++; if(v.correct_corners) stats.ccorners++; }
  });

  var statCards = [
    { label: '胜平负', hit: stats.c1x2, total: stats.t1x2 },
    { label: '大小球2.5', hit: stats.co25, total: stats.to25 },
    { label: '角球±1.5', hit: stats.ccorners, total: stats.tcorners }
  ];

  if(statsArea){
    statsArea.innerHTML = '';
    statCards.forEach(function(card){
      var rate = card.total > 0 ? Math.round(card.hit / card.total * 100) : null;
      var div = document.createElement('div');
      div.className = 'stat-card';
      var color = rate !== null ? (rate >= 55 ? '#34D399' : (rate >= 40 ? '#F5B841' : '#F87171')) : '#54678C';
      div.innerHTML = '<div class="num" style="color:' + color + '">' + (rate !== null ? rate + '%' : '—') + '</div>' +
        '<div class="label">' + card.label + '</div>' +
        '<div class="sub">' + card.hit + '/' + card.total + '场</div>';
      statsArea.appendChild(div);
    });
  }

  if(ST.verify.length === 0){
    area.innerHTML = '<div class="card" style="text-align:center;padding:36px;color:#54678C">还没有验证记录</div>';
    return;
  }

  var h = '';
  ST.verify.forEach(function(v){
    var hasActual = v.actual_score !== null;
    var predLabel = { home: '主胜', draw: '平局', away: '客胜' }[v.pred_1x2] || v.pred_1x2;
    var predOverLabel = v.pred_over25 === 'over' ? '大2.5' : '小2.5';
    var predCorners = v.pred_corners_total !== null ? v.pred_corners_total.toFixed(1) : '?';

    h += '<div class="card" style="margin-bottom:8px">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">';
    h += '<div><div style="font-size:13.5px;font-weight:700">' + esc(v.match) + '</div>';
    h += '<div style="font-size:10.5px;color:#54678C">' + esc(v.league) + ' · ' + esc(v.date) + '</div></div>';
    h += '<div><button class="btn-s red small" data-vdel="' + v.id + '">删除</button></div>';
    h += '</div>';

    h += '<div style="background:#0E1626;border-radius:8px;padding:10px;margin-bottom:8px">';
    h += '<div style="font-size:10px;color:#54678C;font-weight:700;margin-bottom:4px">📌 AI预测</div>';
    h += '<div style="display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px">';
    h += '<span style="color:#6FA8F5">胜平负: <b>' + predLabel + '</b></span>';
    if(v.pred_score) h += '<span style="color:#F5B841">比分: <b>' + esc(v.pred_score) + '</b></span>';
    h += '<span style="color:#8CA0C0">进球: <b>' + predOverLabel + '</b></span>';
    h += '<span style="color:#C084FC">角球预期: <b>' + predCorners + '</b></span>';
    h += '</div></div>';

    if(!hasActual){
      h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">';
      h += '<input class="inp vscore" data-id="' + v.id + '" style="padding:6px 10px;font-size:13px;text-align:center" placeholder="实际比分 如4-0">';
      h += '<input class="inp vcorners" data-id="' + v.id + '" style="padding:6px 10px;font-size:13px;text-align:center" placeholder="实际角球数">';
      h += '</div>';
      h += '<button class="btn-s gold" style="width:100%;padding:6px;font-weight:700" data-vsave="' + v.id + '">✓ 保存结果</button>';
    } else {
      h += '<div style="background:#0E1626;border-radius:8px;padding:10px">';
      h += '<div style="font-size:14px;font-weight:700;color:#E6EDF7;margin-bottom:4px">实际: ' + esc(v.actual_score) + (v.actual_corners !== null ? ' · ' + v.actual_corners + '角球' : '') + '</div>';
      h += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      if(v.correct_1x2 !== null){
        var c1 = v.correct_1x2 ? '#34D399' : '#F87171';
        h += '<span style="padding:2px 8px;border-radius:999px;border:1px solid ' + c1 + '55;background:' + c1 + '14;color:' + c1 + ';font-size:11px;font-weight:700">' + (v.correct_1x2 ? '✓' : '✗') + ' 胜平负</span>';
      }
      if(v.correct_over25 !== null){
        var c2 = v.correct_over25 ? '#34D399' : '#F87171';
        h += '<span style="padding:2px 8px;border-radius:999px;border:1px solid ' + c2 + '55;background:' + c2 + '14;color:' + c2 + ';font-size:11px;font-weight:700">' + (v.correct_over25 ? '✓' : '✗') + ' 大小球</span>';
      }
      if(v.correct_corners !== null){
        var c3 = v.correct_corners ? '#34D399' : '#F87171';
        h += '<span style="padding:2px 8px;border-radius:999px;border:1px solid ' + c3 + '55;background:' + c3 + '14;color:' + c3 + ';font-size:11px;font-weight:700">' + (v.correct_corners ? '✓' : '✗') + ' 角球</span>';
      }
      if(v.correct_score !== null){
        var c4 = v.correct_score ? '#34D399' : '#F87171';
        h += '<span style="padding:2px 8px;border-radius:999px;border:1px solid ' + c4 + '55;background:' + c4 + '14;color:' + c4 + ';font-size:11px;font-weight:700">' + (v.correct_score ? '✓' : '✗') + ' 比分</span>';
      }
      h += '</div></div>';
      h += '<button class="btn-s small" style="margin-top:6px" data-vreset="' + v.id + '">重新填写</button>';
    }
    h += '</div>';
  });

  area.innerHTML = h;
}

function refreshLog(){
  var h = '<div class="sec">投注记录</div>';
  if(!ST.log.length){ h += '<div class="card" style="text-align:center;padding:36px;color:#54678C">还没有记录</div>'; document.getElementById('log-area').innerHTML = h; return; }
  ST.log.forEach(function(b){
    h += '<div class="card" style="margin-bottom:8px;padding:13px"><div style="display:flex;justify-content:space-between"><div style="font-size:13.5px;font-weight:700">'+esc(b.match)+' <span style="font-size:10.5px;color:#54678C;font-weight:400">'+esc(b.league)+'</span></div><button class="btn-s red small" data-action="del" data-id="'+b.id+'">删除</button></div>';
    h += '<div style="font-size:12.5px;color:#F5B841;margin:5px 0">'+esc(b.market)+' · '+esc(b.sel)+'</div>';
    h += '<div style="font-size:11px;color:#54678C">状态: '+(b.result||'待结算')+'</div>';
    h += '</div>';
  });
  document.getElementById('log-area').innerHTML = h;
}

function switchTab(tab){
  ST.tab = tab;
  ['analyze','log','verify'].forEach(function(t){
    document.getElementById('tab-'+t).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.className = 'tab-btn' + (b.dataset.tab === tab ? ' on' : '');
  });
  if(tab === 'log') refreshLog();
  if(tab === 'verify') refreshVerify();
}

function updateKeyUI(){
  var badge = document.getElementById('key-badge');
  if(badge){ if(ST.dsKey && ST.tavilyKey){ badge.textContent = '✓ Keys已设置'; badge.style.color = '#34D399'; } else { badge.textContent = '⚡ 点击设置 API Keys'; badge.style.color = '#F5B841'; } }
}

function toggleKeyPanel(){
  var body = document.getElementById('key-body');
  var arrow = document.getElementById('key-arrow');
  if(!body) return;
  var open = body.style.display === 'none';
  body.style.display = open ? '' : 'none';
  arrow.textContent = open ? '▲' : '▼';
}

function updateEngineStatus(){
  var engine = document.querySelector('input[name="ocrEngine"]:checked');
  if(!engine) return;
  var names = { ios: 'iOS OCR Server', tesseract: 'Tesseract.js', ocrspace: 'OCR.space' };
  document.getElementById('engine-status').textContent = '🔍 当前: ' + (names[engine.value] || '未知');
}

function init(){
  ST.log = loadLog(); ST.verify = loadVerify();
  var dsKey = localStorage.getItem('ds_key') || '';
  var tavilyKey = localStorage.getItem('tavily_key') || '';
  var ocrspaceKey = localStorage.getItem('ocrspace_key') || '';
  var iosUrl = localStorage.getItem('ios_url') || 'http://10.0.1.11:8000';
  var engine = localStorage.getItem('ocr_engine') || 'ios';

  document.getElementById('ds-key-inp').value = dsKey;
  document.getElementById('tavily-key-inp').value = tavilyKey;
  document.getElementById('ocrspace-key-inp').value = ocrspaceKey;
  document.getElementById('ios-url-inp').value = iosUrl;
  ST.dsKey = dsKey; ST.tavilyKey = tavilyKey; ST.ocrspaceKey = ocrspaceKey; ST.iosUrl = iosUrl; ST.ocrEngine = engine;
  updateKeyUI();

  var radios = document.querySelectorAll('input[name="ocrEngine"]');
  radios.forEach(function(el){
    if(el.value === engine) el.checked = true;
    el.addEventListener('change', function(){
      ST.ocrEngine = this.value;
      localStorage.setItem('ocr_engine', this.value);
      updateEngineStatus();
    });
  });
  updateEngineStatus();

  var lr = document.getElementById('league-row');
  if(lr){
    LEAGUES.forEach(function(lg){
      var b = document.createElement('button');
      b.className = 'chip' + (lg === ST.league ? ' on' : '');
      b.dataset.lg = lg; b.textContent = lg;
      b.addEventListener('click', function(){ ST.league = lg; document.querySelectorAll('[data-lg]').forEach(function(c){ c.className = 'chip' + (c.dataset.lg === lg ? ' on' : ''); }); });
      lr.appendChild(b);
    });
  }
  var ctx = document.getElementById('inp-ctx');
  if(ctx){
    CTXS.forEach(function(c){ var o = document.createElement('option'); o.value = c.v; o.textContent = c.l; if(c.v === 'regular') o.selected = true; ctx.appendChild(o); });
  }

  var imgFile = document.getElementById('img-file');
  if(imgFile){
    imgFile.addEventListener('change', function(e){
      var files = Array.from(e.target.files || []);
      e.target.value = '';
      files.slice(0, 8 - ST.images.length).forEach(function(f){
        compressImage(f).then(function(img){ if(ST.images.length < 8){ ST.images.push(img); refreshImgGrid(); } });
      });
    });
  }

  document.getElementById('img-add-btn').addEventListener('click', function(){ document.getElementById('img-file').click(); });
  document.getElementById('analyze-btn').addEventListener('click', analyze);
  document.getElementById('mode-img').addEventListener('click', function(){ setOddsMode('img'); });
  document.getElementById('mode-txt').addEventListener('click', function(){ setOddsMode('txt'); });

  document.querySelectorAll('.tab-btn').forEach(function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.tab); }); });

  document.getElementById('key-toggle').addEventListener('click', toggleKeyPanel);
  document.getElementById('key-show').addEventListener('click', function(){
    var ds = document.getElementById('ds-key-inp');
    var tv = document.getElementById('tavily-key-inp');
    var oc = document.getElementById('ocrspace-key-inp');
    if(ds.type === 'password'){
      ds.type = 'text'; tv.type = 'text'; oc.type = 'text'; this.textContent = '隐藏Keys';
    } else {
      ds.type = 'password'; tv.type = 'password'; oc.type = 'password'; this.textContent = '显示Keys';
    }
  });
  document.getElementById('key-clear').addEventListener('click', function(){
    localStorage.removeItem('ds_key');
    localStorage.removeItem('tavily_key');
    localStorage.removeItem('ocrspace_key');
    document.getElementById('ds-key-inp').value = '';
    document.getElementById('tavily-key-inp').value = '';
    document.getElementById('ocrspace-key-inp').value = '';
    ST.dsKey = ''; ST.tavilyKey = ''; ST.ocrspaceKey = '';
    updateKeyUI();
  });
  document.getElementById('ds-key-inp').addEventListener('input', function(){
    localStorage.setItem('ds_key', this.value);
    ST.dsKey = this.value;
    updateKeyUI();
  });
  document.getElementById('tavily-key-inp').addEventListener('input', function(){
    localStorage.setItem('tavily_key', this.value);
    ST.tavilyKey = this.value;
    updateKeyUI();
  });
  document.getElementById('ocrspace-key-inp').addEventListener('input', function(){
    localStorage.setItem('ocrspace_key', this.value);
    ST.ocrspaceKey = this.value;
    updateKeyUI();
  });
  document.getElementById('ios-url-inp').addEventListener('input', function(){
    localStorage.setItem('ios_url', this.value);
    ST.iosUrl = this.value;
  });

  document.addEventListener('click', function(e){
    var t = e.target;
    var action = t.dataset.action; var id = t.dataset.id ? parseInt(t.dataset.id) : null;
    if(action === 'del' && id){ ST.log = ST.log.filter(function(b){ return b.id !== id; }); saveLog(ST.log); refreshLog(); }
    var vdel = t.dataset.vdel ? parseInt(t.dataset.vdel) : null;
    if(vdel){ delVerify(vdel); }
    var vsave = t.dataset.vsave ? parseInt(t.dataset.vsave) : null;
    if(vsave){
      var scoreEl = document.querySelector('.vscore[data-id="' + vsave + '"]');
      var cornersEl = document.querySelector('.vcorners[data-id="' + vsave + '"]');
      var score = scoreEl ? scoreEl.value.trim() : '';
      var corners = cornersEl ? cornersEl.value.trim() : '';
      if(!score){ alert('请填入实际比分'); return; }
      saveActual(vsave, score, corners);
    }
    var vreset = t.dataset.vreset ? parseInt(t.dataset.vreset) : null;
    if(vreset){ resetVerify(vreset); }
  });

  setOddsMode('img');
  switchTab('analyze');
  refreshLog(); refreshVerify();

  if(window.location.protocol === 'file:'){
    console.warn('⚠️ 检测到 file:// 协议');
    var notice = document.createElement('div');
    notice.style.cssText = 'background:#F8717144;border:1px solid #F87171;color:#F87171;padding:8px 12px;border-radius:6px;margin:10px 14px;font-size:12px;text-align:center';
    notice.textContent = '⚠️ 检测到本地文件模式，建议用 Live Server 启动。';
    document.querySelector('.wrap').prepend(notice);
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
