<style>

// 查询两队预期角球总数
function lookupCorners(league,home,away){
  var db=CORNER_DB[league];
  if(!db)return null;
  // 模糊匹配：忽略大小写，部分匹配
  function findTeam(name){
    if(!name)return null;
    var n=name.trim();
    if(db[n]!==undefined)return{team:n,avg:db[n]};
    var lower=n.toLowerCase();
    var keys=Object.keys(db);
    for(var i=0;i<keys.length;i++){
      if(keys[i].toLowerCase()===lower)return{team:keys[i],avg:db[keys[i]]};
    }
    for(var j=0;j<keys.length;j++){
      if(keys[j].toLowerCase().indexOf(lower)>=0||lower.indexOf(keys[j].toLowerCase())>=0)
        return{team:keys[j],avg:db[keys[j]]};
    }
    return null;
  }
  var h=findTeam(home),a=findTeam(away);
  if(!h&&!a)return null;
  return{home:h,away:a,total:((h?h.avg:0)+(a?a.avg:0))};
}

var LEAGUES=['英超','西甲','意甲','德甲','法甲','欧冠','欧联杯','欧会杯','世界杯','MLS','墨甲','巴西甲','巴西乙','阿根廷甲','阿根廷杯','秘鲁甲','挪超','瑞典甲','瑞典乙','芬超','冰岛超','瑞超','其他'];

var ST={apiKey:localStorage.getItem('vt_key')||'',keyVisible:false,keyPanelOpen:!localStorage.getItem('vt_key'),tab:'analyze',league:'MLS',busy:false,statusIdx:0,result:null,matchLabel:'',log:[],verify:[],reportOpen:false,oddsMode:'img',images:[],live:false};

function toggleLive(){ST.live=!ST.live;var b=document.getElementById('live-toggle');var p=document.getElementById('live-panel');if(b)b.className='chip'+(ST.live?' on':'');if(p)p.style.display=ST.live?'':'none';}
function dbGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadLog(){ST.log=dbGet(LOG_KEY)||[];}
function saveLog(){dbSet(LOG_KEY,ST.log);}
function loadVerify(){ST.verify=dbGet(VERIFY_KEY)||[];}

function getSnap(){return dbGet(SNAP_PRE+ST.league+'_'+getField('home')+'_'+getField('away'));}

function setOddsMode(m){ST.oddsMode=m;document.getElementById('odds-img-panel').style.display=m==='img'?'':'none';document.getElementById('odds-txt-panel').style.display=m==='txt'?'':'none';document.getElementById('mode-img').className='chip'+(m==='img'?' on':'');document.getElementById('mode-txt').className='chip'+(m==='txt'?' on':'');}

function imp(o){return(o&&o>1)?1/o:null;}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function compressImg(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=1568,w=img.width,h=img.height,sc=Math.min(1,MAX/Math.max(w,h));
      w=Math.round(w*sc);h=Math.round(h*sc);
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var url=cv.toDataURL('image/jpeg',0.85);
      cb({b64:url.split(',')[1],type:'image/jpeg',preview:url});
    };img.src=e.target.result;
  };r.readAsDataURL(file);
}

function refreshImgGrid(){
  var grid=document.getElementById('img-preview-grid');

    var im=document.createElement('img');im.src=img.preview;im.style.cssText='width:100%;height:130px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid #1E2A44;display:block';

}

}

function buildPrompt(){
  var today=new Date().toISOString().slice(0,10);
  var home=getField('home'),away=getField('away'),kickoff=getField('kickoff'),odds=getField('odds');
  var ctx=document.getElementById('inp-ctx');
  var ctxVal=ctx?ctx.value:'regular';
  var snap=getSnap();
  var L=[];
  L.push('你是足球盘口价值分析引擎，服务加拿大安省PROLINE+平台的理性投注者。今天：'+today+'。');
  L.push('');
  L.push('比赛：'+ST.league+' · '+home+'（主）vs '+away+'（客）'+(kickoff?' · 开赛：'+kickoff:''));
  L.push('情境：'+(CTX_LABEL[ctxVal]||ctxVal));

  if(ST.live){
    var s=getField('score'),m=getField('min'),c=getField('corners');
    L.push('');L.push('🔴【实时滚球模式】');
    L.push('当前比分：'+(s||'未提供')+' · 分钟：'+(m||'?')+'分 · 当前角球：'+(c||'未提供'));
    L.push('实时规则：①比分走向优先——领先方收缩，角球进球节奏骤降；落后方压上，角球加速');
    L.push('②节奏折算——当前角球/已踢分钟×90，按比分走向修正');
    L.push('③剩余时间可行性——每个推荐盘口必须计算"还差几个+剩余几分钟是否够"');
    L.push('④edge判断格外保守，只推荐节奏与赔率明显错位的盘口');
  }

  if(ST.oddsMode==='img'&&ST.images.length){L.push('');L.push('【附'+ST.images.length+'张PROLINE+盘口截图，先仔细读出所有盘口名称、方向与赔率，合并去重后作为用户实价】');}
  else if(odds){L.push('');L.push('【PROLINE+盘口实价（用户提供）】');L.push(odds);}
  else{L.push('');L.push('【未提供实价，markets中odds填null】');}

  if(snap){L.push('');L.push('【历史快照'+snap.ts+'】主胜'+snap.home+'/平'+snap.draw+'/客胜'+snap.away+'。对比当前变动判断是否有异动信号，输出trap_check字段。');}

function extractJSON(data){
  var text=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').replace(/```json|```/g,'');
  var a=text.indexOf('{'),b=text.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('NO_JSON');
  return JSON.parse(text.slice(a,b+1));
}

function callAPI(msgs,useSearch,cb,errCb){
  var body={model:'claude-sonnet-4-6',max_tokens:8000,messages:msgs};
  if(useSearch)body.tools=[{type:'web_search_20250305',name:'web_search'}];
  var xhr=new XMLHttpRequest();
  xhr.open('POST','https://api.anthropic.com/v1/messages',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('x-api-key',ST.apiKey.trim());
  xhr.setRequestHeader('anthropic-version','2023-06-01');
  xhr.setRequestHeader('anthropic-dangerous-direct-browser-access','true');
  xhr.onload=function(){
    try{
      var data=JSON.parse(xhr.responseText);
      if(data.error||data.type==='error'){var e=data.error||{};errCb((e.type||'error')+': '+(e.message||'').slice(0,300));return;}
      cb(data);
    }catch(e){errCb('解析失败：'+xhr.responseText.slice(0,300));}
  };
  xhr.onerror=function(){errCb('网络错误，请检查连接');};
  xhr.send(JSON.stringify(body));
}

function runAnalysis(cb,errCb){
  var content=[];
  if(ST.oddsMode==='img'&&ST.images.length){
    ST.images.forEach(function(img){content.push({type:'image',source:{type:'base64',media_type:img.type,data:img.b64}});});
  }
  content.push({type:'text',text:buildPrompt()});
  var base=[{role:'user',content:content}];
  var msgs=base;var g=0;var jsonRetried=false;
  function tryParse(data){
    try{cb(extractJSON(data));}
    catch(e){
      if(!jsonRetried){
        jsonRetried=true;
        setStatus('JSON修复重试中…');
        var fixMsgs=msgs.concat([
          {role:'assistant',content:data.content},
          {role:'user',content:[{type:'text',text:'JSON解析失败，请重新输出完整且格式正确的JSON，只输出JSON本身，不要任何其他文字或markdown围栏。'}]}
        ]);
        callAPI(fixMsgs,false,function(d2){try{cb(extractJSON(d2));}catch(e2){errCb('修复重试仍失败：'+String(e2).slice(0,200));}},errCb);
      }else{errCb(e.message||String(e));}
    }
  }
  function doCall(useSearch){
    callAPI(msgs,useSearch,function(data){
      if(data.stop_reason==='pause_turn'&&g++<5){msgs=msgs.concat([{role:'assistant',content:data.content}]);doCall(true);}
      else if(data.stop_reason==='max_tokens'){errCb('输出被截断，请重试');}
      else{tryParse(data);}
    },function(err){
      if(useSearch){callAPI(base,false,function(data){try{var r=extractJSON(data);r._offline=true;cb(r);}catch(e){errCb(e.message||String(e));}},errCb);}
      else{errCb(err);}
    });
  }
  doCall(true);
}

function analyze(){
  if(!ST.apiKey.trim()){alert('请先填入API Key');return;}
  var home=getField('home'),away=getField('away');
  if(!home||!away){alert('请填写主客队名称');return;}
  var btn=document.getElementById('analyze-btn');
  if(btn){btn.disabled=true;btn.textContent='分析中…';}
  ST.busy=true;ST.statusIdx=0;ST.result=null;ST.reportOpen=false;
  ST.matchLabel=ST.league+' · '+home+' vs '+away;
  setError('');document.getElementById('results-area').style.display='none';
  setStatus(STATUSES[0]+' (约30-90秒)');
  var t=setInterval(function(){ST.statusIdx=(ST.statusIdx+1)%STATUSES.length;setStatus(STATUSES[ST.statusIdx]+' (约30-90秒)');},4000);
  runAnalysis(function(r){
    clearInterval(t);setStatus('');ST.result=r;ST.busy=false;
    if(r.odds_snapshot&&r.odds_snapshot.home)setSnap({home:r.odds_snapshot.home,draw:r.odds_snapshot.draw,away:r.odds_snapshot.away,ts:new Date().toLocaleString('zh-CN')});
    if(btn){btn.disabled=false;btn.textContent='开始分析';}
    renderResults();
  },function(err){
    clearInterval(t);setStatus('');ST.busy=false;
    if(btn){btn.disabled=false;btn.textContent='开始分析';}
    setError('分析失败：'+String(err).slice(0,400));
  });
}

function recordBet(){
  var r=ST.result;if(!r||!r.rec)return;
  var markets=(r.result&&r.result.markets)||r.markets||[];
  var mk=(markets).find(function(m){return m.m===r.rec.market&&m.s===r.rec.sel;});
  var home=getField('home'),away=getField('away');
  var entry={id:Date.now(),date:new Date().toISOString().slice(0,10),league:ST.league,match:home+' vs '+away,market:r.rec.market,sel:r.rec.sel,odds:mk&&mk.odds||null,p:mk&&mk.p||null,stake:parseFloat((r.rec.stake||'').replace(/[^0-9.]/g,''))||5,ret:null,result:'pending'};
  ST.log.unshift(entry);saveLog();switchTab('log');refreshLog();
}

function addVerify(){
  var r=ST.result;var home=getField('home'),away=getField('away');
  if(!home||!away)return;
  var pr=r&&r.probs||{};
  var g=r&&r.goals||{};
  var cn=r&&r.corners||{};
  var pred_1x2=pr.home>pr.away?(pr.home>pr.draw?'home':'draw'):(pr.away>pr.draw?'away':'draw');
  var entry={id:Date.now(),date:new Date().toISOString().slice(0,10),league:ST.league,match:home+' vs '+away,pred_1x2:pred_1x2,pred_score:r&&r.predicted_score||'',pred_over25:g.over25>=0.5?'over':'under',pred_corners:cn.exp_total||null,actual:null,accuracy:null};
  ST.verify.unshift(entry);saveVerify();switchTab('verify');refreshVerify();
}

function updateLog(id,patch){ST.log=ST.log.map(function(b){return b.id===id?Object.assign({},b,patch):b;});saveLog();refreshLog();}
function delLog(id){ST.log=ST.log.filter(function(b){return b.id!==id;});saveLog();refreshLog();}
function setLogResult(b,res){var ret=null;if(res==='win')ret=b.odds?+(b.stake*b.odds).toFixed(2):null;if(res==='loss')ret=0;if(res==='push')ret=b.stake;updateLog(b.id,{result:res,ret:ret});}

function saveActual(id,actual){
  ST.verify=ST.verify.map(function(v){
    if(v.id!==id)return v;
    var acc={};var parts=(actual.score||'').split('-');var hg=parseInt(parts[0]),ag=parseInt(parts[1]);
    if(!isNaN(hg)&&!isNaN(ag)){
      actual.result_1x2=hg>ag?'home':hg===ag?'draw':'away';actual.over25=hg+ag>2.5?'over':'under';actual.btts=hg>0&&ag>0?'yes':'no';
      if(v.pred_1x2)acc.correct_1x2=v.pred_1x2===actual.result_1x2;
      if(v.pred_score)acc.correct_score=v.pred_score===actual.score;
      if(v.pred_over25)acc.correct_over25=v.pred_over25===actual.over25;
    }
    if(actual.corners!=null&&v.pred_corners!=null)acc.corners_within1=Math.abs(actual.corners-v.pred_corners)<=1.5;
    return Object.assign({},v,{actual:actual,accuracy:acc});
  });
  saveVerify();refreshVerify();
}
function delVerify(id){ST.verify=ST.verify.filter(function(v){return v.id!==id;});saveVerify();refreshVerify();}

    h+='<div class="card" style="margin-bottom:8px;padding:13px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px"><div style="font-size:13.5px;font-weight:700">'+esc(b.match)+' <span style="font-size:10.5px;color:#54678C;font-weight:400">'+esc(b.league)+' · '+esc(b.date)+'</span></div><button class="btn-s red" data-action="del" data-id="'+b.id+'">删除</button></div>';

      h+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button class="btn-s green" data-action="win" data-id="'+b.id+'">赢</button><button class="btn-s red" data-action="loss" data-id="'+b.id+'">输</button><button class="btn-s" data-action="push" data-id="'+b.id+'">走水</button><span style="font-size:11px;color:#54678C">Cash Out→</span><input type="number" placeholder="实收$" class="inp" style="width:78px;padding:5px 8px;font-size:12px" data-cashout="'+b.id+'"></div>';
    }else{
      var rc={win:'#34D399',loss:'#F87171',push:'#8CA0C0',cashout:'#F5B841'}[b.result];
      var rl={win:'✓ 赢',loss:'✗ 输',push:'− 走水',cashout:'⇄ Cash Out'}[b.result];
      h+='<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:'+rc+'">'+rl+' <span style="color:#8CA0C0;font-weight:400" class="num">回收'+fmtM(b.ret||0)+' 净'+((b.ret||0)-b.stake>=0?'+':'')+fmtM((b.ret||0)-b.stake)+'</span></span><button class="btn-s" data-action="unsettle" data-id="'+b.id+'">改</button></div>';

function updateTabLabels(){
  var pending=ST.verify.filter(function(v){return!v.actual||!v.actual.score;}).length;
  document.querySelectorAll('.tab-btn').forEach(function(t){
    if(t.dataset.tab==='log')t.textContent='🧾 日志'+(ST.log.length?' ('+ST.log.length+')':'');

  });
}

function switchTab(tab){
  ST.tab=tab;
  ['analyze','log','verify'].forEach(function(t){document.getElementById('tab-'+t).style.display=t===tab?'':'none';});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.className='tab-btn'+(b.dataset.tab===tab?' on':'');});
  if(tab==='log')refreshLog();
  if(tab==='verify')refreshVerify();
}

function updateKeyUI(){
  var badge=document.getElementById('key-badge');var kc=document.getElementById('key-clear');
  if(badge){if(ST.apiKey){badge.textContent='✓ API Key 已设置';badge.style.color='#34D399';}else{badge.textContent='⚡ 点击设置 Anthropic API Key';badge.style.color='#F5B841';}}
  if(kc)kc.style.display=ST.apiKey?'':'none';
}

function toggleKeyPanel(){var body=document.getElementById('key-body');var arrow=document.getElementById('key-arrow');if(!body)return;var open=body.style.display==='none';body.style.display=open?'':'none';if(arrow)arrow.textContent=open?'▲':'▼';}

function init(){
  loadLog();loadVerify();updateKeyUI();
  var lr=document.getElementById('league-row');
  if(lr){LEAGUES.forEach(function(lg){var b=document.createElement('button');b.className='chip'+(lg===ST.league?' on':'');b.dataset.lg=lg;b.textContent=lg;b.addEventListener('click',function(){ST.league=lg;document.querySelectorAll('[data-lg]').forEach(function(c){c.className='chip'+(c.dataset.lg===lg?' on':'');});});lr.appendChild(b);});}
  var ctx=document.getElementById('inp-ctx');
  if(ctx){CTXS.forEach(function(c){var o=document.createElement('option');o.value=c.v;o.textContent=c.l;if(c.v==='regular')o.selected=true;ctx.appendChild(o);});}
  var imgFile=document.getElementById('img-file');
  if(imgFile){imgFile.addEventListener('change',function(e){var files=Array.from(e.target.files||[]);e.target.value='';files.slice(0,8-ST.images.length).forEach(function(f){compressImg(f,function(img){if(ST.images.length<8){ST.images.push(img);refreshImgGrid();}});});});}
  var ab=document.getElementById('analyze-btn');if(ab)ab.addEventListener('click',analyze);
  document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab);});});
  var kt=document.getElementById('key-toggle');if(kt)kt.addEventListener('click',toggleKeyPanel);
  var ki=document.getElementById('key-inp');
  if(ki){ki.value=ST.apiKey;ki.addEventListener('input',function(){ST.apiKey=ki.value;localStorage.setItem('vt_key',ki.value);updateKeyUI();});}
  var ks=document.getElementById('key-show');
  if(ks)ks.addEventListener('click',function(){ST.keyVisible=!ST.keyVisible;var ki2=document.getElementById('key-inp');if(ki2)ki2.type=ST.keyVisible?'text':'password';ks.textContent=ST.keyVisible?'隐藏':'显示';});
  var kc=document.getElementById('key-clear');
  if(kc)kc.addEventListener('click',function(){ST.apiKey='';localStorage.removeItem('vt_key');var ki2=document.getElementById('key-inp');if(ki2)ki2.value='';updateKeyUI();});
  document.addEventListener('click',function(e){
    var t=e.target;
    var action=t.dataset.action;var id=t.dataset.id?parseInt(t.dataset.id):null;
    if(action==='del'&&id)delLog(id);
    else if(action==='win'&&id)setLogResult(ST.log.find(function(b){return b.id===id;})||{},  'win');
    else if(action==='loss'&&id)setLogResult(ST.log.find(function(b){return b.id===id;})||{},'loss');
    else if(action==='push'&&id)setLogResult(ST.log.find(function(b){return b.id===id;})||{},'push');
    else if(action==='unsettle'&&id)updateLog(id,{result:'pending',ret:null});
    var vdelId=t.dataset.vdel?parseInt(t.dataset.vdel):null;
    var vsaveId=t.dataset.vsave?parseInt(t.dataset.vsave):null;
    var vresetId=t.dataset.vreset?parseInt(t.dataset.vreset):null;
    if(vdelId)delVerify(vdelId);
    else if(vsaveId){var scoreEl=document.getElementById('vscore_'+vsaveId);var cornersEl=document.getElementById('vcorners_'+vsaveId);var score=scoreEl?scoreEl.value.trim():'';if(!score){alert('请填入实际比分');return;}var corners=parseFloat(cornersEl?cornersEl.value:'');var actual={score:score};if(!isNaN(corners))actual.corners=corners;saveActual(vsaveId,actual);}
    else if(vresetId){ST.verify=ST.verify.map(function(v){return v.id===vresetId?Object.assign({},v,{actual:null,accuracy:null}):v;});saveVerify();refreshVerify();}
  });
  document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var co=e.target.dataset.cashout;if(co){var v=parseFloat(e.target.value);if(!isNaN(v)){var id=parseInt(co);ST.log=ST.log.map(function(b){return b.id===id?Object.assign({},b,{result:'cashout',ret:v}):b;});saveLog();refreshLog();}}});
  if(ST.keyPanelOpen)toggleKeyPanel();
  updateTabLabels();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
