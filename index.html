<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>盘口价值分析终端</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B1220;color:#E6EDF7;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh;padding-bottom:70px}
input,textarea,select,button{font-family:inherit;font-size:14px}
input::placeholder,textarea::placeholder{color:#54678C}
input:focus,textarea:focus,select:focus{outline:none;border-color:#F5B84188!important}
select option{background:#121B2E}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
.card{background:#121B2E;border:1px solid #1E2A44;border-radius:12px;padding:16px;margin-bottom:10px}
.inp{width:100%;padding:10px 12px;background:#0E1626;border:1px solid #1E2A44;border-radius:9px;color:#E6EDF7;outline:none}
.sec{font-size:11px;letter-spacing:.18em;color:#54678C;margin:22px 0 10px;font-weight:700}
.chip{padding:7px 13px;border-radius:999px;border:1px solid #1E2A44;background:transparent;color:#8CA0C0;font-size:12.5px;cursor:pointer;margin:0 3px 6px 0;display:inline-block}
.chip.on{border-color:#F5B841;background:#F5B84122;color:#F5B841;font-weight:700}
.btn-p{padding:13px 0;width:100%;border-radius:10px;border:none;background:linear-gradient(135deg,#F5B841,#E09A1F);color:#161006;font-size:15px;font-weight:800;cursor:pointer}
.btn-p:disabled{background:#2A3654;color:#54678C;cursor:not-allowed}
.btn-s{padding:6px 12px;border-radius:8px;border:1px solid #1E2A44;background:transparent;color:#8CA0C0;font-size:12px;cursor:pointer}
.gold{color:#F5B841;border-color:#F5B841!important}
.red{color:#F87171;border-color:#F87171!important}
.green{color:#34D399;border-color:#34D399!important}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{display:flex;background:#0D1424;border-bottom:1px solid #1E2A44;position:sticky;top:0;z-index:5}
.tab-btn{flex:1;padding:13px 0;font-size:13px;color:#54678C;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tab-btn.on{color:#F5B841;font-weight:800;border-bottom-color:#F5B841}
.prob-seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;border-right:1px solid #0B1220}
.erow{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr 1fr;gap:6px;align-items:center;padding:9px 6px;border-bottom:1px solid #25335280}
.ebar{width:50px;height:5px;background:#0E1626;border-radius:3px;position:relative;overflow:hidden;display:inline-block}
.num{font-variant-numeric:tabular-nums;font-family:'SF Mono',Consolas,monospace}
.slip{background:linear-gradient(160deg,#182543,#121B2E);border:1px solid #F5B84155;border-radius:14px;padding:18px;margin:16px 0 6px;position:relative;overflow:hidden}
.slip-bar{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#F5B841,transparent)}
.warn{padding:10px 12px;background:#F8717114;border:1px solid #F8717155;border-radius:9px;margin-bottom:10px}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.pulse{animation:pulse 1.6s infinite}
</style>

<script>
'use strict';

// ── 常量 ──
var LEAGUES = ['英超','西甲','意甲','德甲','法甲','欧冠','欧联杯','世界杯','MLS','墨甲','巴西甲','巴西乙','阿根廷甲','阿根廷杯','秘鲁甲','挪超','瑞典甲','瑞典乙','芬兰甲','其他'];
var CTXS = [
  {v:'regular',l:'联赛常规轮次'},
  {v:'critical',l:'关键战(争冠/保级/欧战)'},
  {v:'cup_ko',l:'杯赛淘汰赛(单场淘汰)'},
  {v:'cup_leg1',l:'杯赛两回合·第一回合'},
  {v:'cup_leg2',l:'⚠️ 杯赛两回合·第二回合(动机扭曲·谨慎)'},
  {v:'derby',l:'⚠️ 德比战(数据可靠性低)'},
  {v:'new_coach',l:'⚠️ 新教练首秀(战术未知)'},
  {v:'group_last',l:'小组赛末轮'},
  {v:'dead',l:'无关痛痒'}
];
var CTX = {};
CTXS.forEach(function(c){CTX[c.v]=c.l;});
var MIN_ODDS = 1.3;
var LOG_KEY = 'vt_log';
var SNAP_PRE = 'vt_snap_';
var STATUS = ['搜索两队近况与伤病…','核对积分形势与动机…','对比市场共识赔率…','扫描盘口价值…','生成分析结论…'];

// ── 状态 ──
var ST = {
  apiKey: localStorage.getItem('vt_key') || '',
  keyVisible: false,
  keyPanelOpen: !localStorage.getItem('vt_key'),
  tab: 'analyze',
  league: '世界杯',
  busy: false,
  statusIdx: 0,
  result: null,
  matchLabel: '',
  log: [],
  reportOpen: false,
  oddsMode: 'img',   // 'img' | 'txt'
  images: [],        // [{b64, type, preview}]
  live: false        // 实时模式
};

function toggleLive(){
  ST.live=!ST.live;
  var btn=document.getElementById('live-toggle');
  var panel=document.getElementById('live-panel');
  if(btn)btn.className='chip'+(ST.live?' on':'');
  if(panel)panel.style.display=ST.live?'':'none';
}

// ── 存储 ──
function dbGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getSnap(){return dbGet(SNAP_PRE+ST.league+'_'+getField('home')+'_'+getField('away'));}
function setSnap(v){dbSet(SNAP_PRE+ST.league+'_'+getField('home')+'_'+getField('away'),v);}
function loadLog(){ST.log=dbGet(LOG_KEY)||[];}
function saveLog(){dbSet(LOG_KEY,ST.log);}
function getField(id){var el=document.getElementById('inp-'+id);return el?el.value.trim():'';}

// ── 截图处理 ──
function setOddsMode(mode){
  ST.oddsMode=mode;
  document.getElementById('odds-img-panel').style.display=mode==='img'?'':'none';
  document.getElementById('odds-txt-panel').style.display=mode==='txt'?'':'none';
  document.getElementById('mode-img').className='chip'+(mode==='img'?' on':'');
  document.getElementById('mode-txt').className='chip'+(mode==='txt'?' on':'');
}

function compressImg(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=1568,w=img.width,h=img.height;
      var sc=Math.min(1,MAX/Math.max(w,h));
      w=Math.round(w*sc);h=Math.round(h*sc);
      var cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var url=cv.toDataURL('image/jpeg',0.85);
      cb({b64:url.split(',')[1],type:'image/jpeg',preview:url});
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function refreshImgGrid(){
  var grid=document.getElementById('img-preview-grid');
  var addBtn=document.getElementById('img-add-btn');
  if(!grid)return;
  grid.innerHTML='';
  ST.images.forEach(function(img,i){
    var wrap=document.createElement('div');
    wrap.style.cssText='position:relative';
    var im=document.createElement('img');
    im.src=img.preview;
    im.style.cssText='width:100%;height:130px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid #1E2A44;display:block';
    var del=document.createElement('button');
    del.textContent='✕';
    del.style.cssText='position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:#000000AA;color:#F87171;font-size:12px;cursor:pointer;line-height:22px;padding:0';
    del.onclick=function(){ST.images.splice(i,1);refreshImgGrid();};
    var num=document.createElement('div');
    num.textContent=i+1;
    num.style.cssText='position:absolute;bottom:4px;left:6px;font-size:9.5px;color:#8CA0C0;background:#000000AA;padding:1px 5px;border-radius:5px';
    wrap.appendChild(im);wrap.appendChild(del);wrap.appendChild(num);
    grid.appendChild(wrap);
  });
  if(addBtn)addBtn.textContent=ST.images.length?'+ 继续添加 ('+ST.images.length+'/8)\n自动压缩，AI合并读取':'点击上传截图 (最多8张，自动压缩)\n从PROLINE+截图后直接上传，AI合并读取所有盘口';
}

// ── 数学 ──
function pct(x){return(x==null||isNaN(x))? '—':(x*100).toFixed(1)+'%';}
function imp(o){return(o&&o>1)?1/o:null;}
function fmtM(x){return '$'+(Math.round(x*100)/100).toFixed(2);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function poissonPMF(k,lam){
  if(!lam||lam<=0||k<0||k>10)return 0;
  var f=1;for(var i=2;i<=k;i++)f*=i;
  return Math.exp(-lam)*Math.pow(lam,k)/f;
}

function buildCSA(he,ae,scores){
  var h=parseFloat(he),a=parseFloat(ae);
  if(isNaN(h)||isNaN(a)||h<=0||a<=0||!scores||!scores.length)return null;
  var rows=scores.map(function(s){
    var p=poissonPMF(s.h,h)*poissonPMF(s.a,a),im=imp(s.odds);
    return{h:s.h,a:s.a,odds:s.odds,p:p,edge:im!=null?p-im:null};
  }).sort(function(a,b){return(b.edge||0)-(a.edge||0);});
  var ph=0,pd=0,pa=0,pu=0;
  for(var i=0;i<=9;i++)for(var j=0;j<=9;j++){
    var p=poissonPMF(i,h)*poissonPMF(j,a);
    if(i>j)ph+=p;else if(i===j)pd+=p;else pa+=p;
    if(i+j<=2)pu+=p;
  }
  return{rows:rows,mp:{h:ph,d:pd,a:pa},mO25:1-pu};
}

function deriveP(m,s,pr){
  if(!pr||pr.home==null)return null;
  var h=pr.home,d=pr.draw,a=pr.away;
  var ml=(m||'').toLowerCase(),sl=(s||'').toLowerCase();
  if(ml.indexOf('让球')>=0||ml.indexOf('handicap')>=0){
    if(sl.indexOf('+0.5')>=0)return(sl.indexOf('主')>=0||sl.indexOf('home')>=0)?h+d:d+a;
    if(sl.indexOf('-0.5')>=0)return(sl.indexOf('客')>=0||sl.indexOf('away')>=0)?d+a:h;
  }
  if(ml.indexOf('double')>=0||ml.indexOf('双重')>=0){
    if(sl==='1x'||sl.indexOf('主平')>=0)return h+d;
    if(sl==='x2'||sl.indexOf('平客')>=0)return d+a;
    if(sl==='12'||sl.indexOf('主客')>=0)return h+a;
  }
  if(ml.indexOf('tnb')>=0||ml.indexOf('tie no')>=0){
    if(sl.indexOf('主')>=0||sl.indexOf('home')>=0)return h/(h+a);
    if(sl.indexOf('客')>=0||sl.indexOf('away')>=0)return a/(h+a);
  }
  return null;
}

function getWarnings(r){
  if(!r)return[];
  var w=[];
  var pr=r.probs,cs=r.consensus,g=r.goals,mk=r.markets;
  if(pr&&cs&&cs.home!=null){
    var maxD=Math.max(Math.abs(pr.home-cs.home),Math.abs((pr.draw||0)-(cs.draw||0)),Math.abs((pr.away||0)-(cs.away||0)));
    if(maxD>0.05)w.push({msg:'AI概率与共识最大偏差'+(maxD*100).toFixed(1)+'pp',sev:maxD>0.08});
  }
  if(cs&&cs.over25!=null&&g&&g.over25!=null){
    var d1=g.over25-cs.over25;
    if(Math.abs(d1)>0.08)w.push({msg:'大2.5概率与共识偏差'+(d1*100).toFixed(1)+'pp',sev:Math.abs(d1)>0.12});
  }
  if(g&&g.home_exp&&g.away_exp&&g.over25!=null){
    var he2=parseFloat(g.home_exp),ae2=parseFloat(g.away_exp);
    if(!isNaN(he2)&&!isNaN(ae2)&&he2>0&&ae2>0){
      var pu2=0;
      for(var i2=0;i2<=8;i2++)for(var j2=0;j2<=8;j2++)if(i2+j2<=2)pu2+=poissonPMF(i2,he2)*poissonPMF(j2,ae2);
      var po=1-pu2,d2=g.over25-po;
      if(Math.abs(d2)>0.10)w.push({msg:'大2.5('+pct(g.over25)+')与泊松换算('+pct(po)+')差'+(d2*100).toFixed(1)+'pp',sev:true});
    }
  }
  (mk||[]).forEach(function(m2){
    if(m2.p==null||m2.odds==null)return;
    var dv=deriveP(m2.m,m2.s,pr);
    if(dv!=null&&Math.abs(m2.p-dv)>0.12)
      w.push({msg:m2.m+'·'+m2.s+' AI给'+pct(m2.p)+'但1X2推算≈'+pct(dv)+',差'+((m2.p-dv)*100).toFixed(1)+'pp — 可能混淆盘口定义',sev:true});
  });
  return w;
}

function edgeColor(e){
  if(e==null)return'#54678C';
  if(e>0.06)return'#34D399';
  if(e>0.02)return'#F5B841';
  if(e<-0.02)return'#F87171';
  return'#8CA0C0';
}

// ── Prompt ──
function buildPrompt(){
  var today=new Date().toISOString().slice(0,10);
  var snap=getSnap();
  var home=getField('home'),away=getField('away');
  var kickoff=getField('kickoff'),odds=getField('odds');
  var ctx=document.getElementById('inp-ctx');
  var ctxVal=ctx?ctx.value:'regular';
  var L=[];
  L.push('你是足球盘口价值分析引擎,服务加拿大安省PROLINE+平台的理性投注者。今天:'+today+'。');
  L.push('');
  L.push('比赛:'+ST.league+' · '+home+'(主) vs '+away+'(客)'+(kickoff?' · 开赛:'+kickoff:''));
  L.push('情境:'+(CTX[ctxVal]||ctxVal));
  if(ST.live){
    var lvScore=getField('live-score'),lvMin=getField('live-min'),lvCorners=getField('live-corners');
    L.push('');
    L.push('🔴【实时滚球模式】比赛正在进行!');
    L.push('当前比分:'+(lvScore||'未提供')+' · 比赛进行至:'+(lvMin||'?')+'分钟 · 当前角球数:'+(lvCorners||'未提供'));
    L.push('实时分析规则:');
    L.push('①比分走向优先——领先方(尤其领先2球以上)大概率收缩,角球和进球节奏骤降;落后方压上,角球加速、但也可能被打反击丢更多球。');
    L.push('②节奏折算——用当前数据折算全场:角球折算=当前角球数/已踢分钟*90,但需按比分走向修正(领先方收手下调,僵局或落后方追分上调)。');

// ── API ──
function extractJSON(data){
  var text=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n').replace(/```json|```/g,'');
  var a=text.indexOf('{'),b=text.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('NO_JSON:'+text.slice(0,300));
  return JSON.parse(text.slice(a,b+1));
}

function callAPI(msgs,useSearch,cb,errCb){
  var body={model:'claude-sonnet-4-6',max_tokens:16000,messages:msgs};
  if(useSearch)body.tools=[{type:'web_search_20250305',name:'web_search'}];  var xhr=new XMLHttpRequest();
  xhr.open('POST','https://api.anthropic.com/v1/messages',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('x-api-key',ST.apiKey.trim());
  xhr.setRequestHeader('anthropic-version','2023-06-01');
  xhr.setRequestHeader('anthropic-dangerous-direct-browser-access','true');
  xhr.onload=function(){
    try{
      var data=JSON.parse(xhr.responseText);
      if(data.error||data.type==='error'){var e=data.error||{};errCb((e.type||'error')+': '+(e.message||'').slice(0,200));return;}
      cb(data);
    }catch(e){errCb('解析失败:'+xhr.responseText.slice(0,200));}
  };
  xhr.onerror=function(){errCb('网络错误,请检查连接');};
  xhr.send(JSON.stringify(body));
}

function runAnalysis(prompt,cb,errCb){
  // 构建第一条消息内容：图片（如有）+ 文字prompt
  var content=[];
  if(ST.oddsMode==='img'&&ST.images.length){
    ST.images.forEach(function(img){
      content.push({type:'image',source:{type:'base64',media_type:img.type,data:img.b64}});
    });
  }
  content.push({type:'text',text:prompt});
  var msgs=[{role:'user',content:content}];
  var guard=0;
  var jsonRetried=false;
  function tryParse(data){
    try{cb(extractJSON(data));}
    catch(e){
      if(!jsonRetried){
        // JSON格式错误 → 回传错误让AI修复重试一次
        jsonRetried=true;
        setStatus('JSON格式修复重试中…');
        var fixMsgs=msgs.concat([
          {role:'assistant',content:data.content},
          {role:'user',content:[{type:'text',text:'你上一条输出的JSON解析失败:'+String(e.message||e).slice(0,200)+'。请重新输出完整且格式正确的JSON,只输出JSON本身,不要任何其他文字、注释或markdown围栏。特别注意:字符串内的引号必须转义,不能有尾逗号。'}]}
        ]);
        callAPI(fixMsgs,false,function(d2){
          try{cb(extractJSON(d2));}
          catch(e2){errCb('JSON修复重试仍失败: '+String(e2.message||e2).slice(0,300));}
        },errCb);
      }else{errCb(e.message||String(e));}
    }
  }
  function doCall(useSearch){
    callAPI(msgs,useSearch,function(data){
      if(data.stop_reason==='pause_turn'&&guard++<5){
        msgs=msgs.concat([{role:'assistant',content:data.content}]);
        doCall(true);
      }else if(data.stop_reason==='max_tokens'){
        errCb('输出被截断,请重试');
      }else{
        tryParse(data);
      }
    },function(err){
      if(useSearch){
        guard=0;
        callAPI(msgs,false,function(data){
          try{var r=extractJSON(data);r._offline=true;cb(r);}
          catch(e){errCb(e.message||String(e));}
        },errCb);
      }else{errCb(err);}
    });
  }
  doCall(true);
}

// ── 结果渲染 ──
function getSorted(r){
  if(!r||!r.markets)return[];
  return r.markets.slice().sort(function(a,b){
    var ea=(a.odds&&a.p!=null)?a.p-1/a.odds:-9;
    var eb=(b.odds&&b.p!=null)?b.p-1/b.odds:-9;
    return eb-ea;
  });
}

      var bw=edge==null?0:Math.min(Math.abs(edge)/0.15,1)*50;
      var bl=edge!=null&&edge>=0?50:50-bw;
      h+='<div class="erow" style="opacity:'+(blocked?'.35':'1')+'">';
      h+='<div><div style="font-size:12.5px;font-weight:600">'+esc(mk.m)+' · '+esc(mk.s)+'</div><div style="font-size:10px;color:#54678C">'+(blocked?'赔率&lt;1.3 排除':esc(mk.note||''))+'</div></div>';
      h+='<div style="font-size:13px;color:#F5B841;font-weight:700;text-align:center" class="num">'+esc(mk.odds||'—')+'</div>';
      h+='<div style="font-size:11.5px;color:#8CA0C0;text-align:center" class="num">'+pct(im)+'</div>';
      h+='<div style="font-size:11.5px;color:#6FA8F5;text-align:center" class="num">'+pct(mk.p)+'</div>';
      h+='<div style="display:flex;align-items:center;gap:5px;justify-content:flex-end"><span class="ebar"><span style="position:absolute;left:'+bl+'%;width:'+bw+'%;top:0;bottom:0;background:'+ec+';border-radius:3px"></span><span style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:#1E2A44"></span></span>';
      h+='<span style="font-size:11.5px;font-weight:800;color:'+ec+';width:48px;text-align:right" class="num">'+(edge==null?'—':(edge>0?'+':'')+(edge*100).toFixed(1)+'%')+'</span></div></div>';
    });
    h+='<div style="font-size:10px;color:#54678C;margin-top:8px">edge=AI概率−1/实价 · +3%以下为噪音 · +6%以上实质价值 · 赔率&lt;1.3排除</div></div>';
  }

  // correct scores
  if(csa&&csa.rows.length){
    h+='<div class="card" style="margin-top:0;padding:14px 12px">';
    h+='<div style="font-size:12px;color:#54678C;font-weight:700;letter-spacing:.1em;margin-bottom:4px">波胆泊松扫描 <span style="font-weight:400">(门槛+10%)</span></div>';
    h+='<div style="font-size:10.5px;color:#FB923C;margin-bottom:6px">⚠ 双泊松简化模型,误差大于胜平负盘</div>';
    h+='<div style="font-size:10.5px;color:#54678C;margin-bottom:6px">模型1X2: <span style="color:#F5B841">'+pct(csa.mp.h)+'/'+pct(csa.mp.d)+'/'+pct(csa.mp.a)+'</span></div>';
    csa.rows.slice(0,8).forEach(function(row){
      var im2=imp(row.odds),ec2=row.edge==null?'#54678C':row.edge>0.10?'#34D399':row.edge<0?'#F87171':'#8CA0C0';
      h+='<div style="display:grid;grid-template-columns:1.4fr .6fr .6fr .6fr .8fr;gap:6px;align-items:center;padding:7px 4px;border-bottom:1px solid #25335280">';
      h+='<div style="font-size:12px;font-weight:700">'+esc(home)+' '+row.h+'-'+row.a+' '+esc(away)+'</div>';
      h+='<div style="font-size:12px;color:#F5B841;text-align:center">'+esc(row.odds||'—')+'</div>';
      h+='<div style="font-size:11px;color:#8CA0C0;text-align:center">'+pct(im2)+'</div>';
      h+='<div style="font-size:11px;color:#6FA8F5;text-align:center">'+pct(row.p)+'</div>';
      h+='<div style="font-size:11.5px;font-weight:800;color:'+ec2+';text-align:right">'+(row.edge==null?'—':(row.edge>0?'+':'')+(row.edge*100).toFixed(1)+'%')+'</div></div>';
    });
    h+='</div>';
  }

  // recommendation
  if(rec){
    var recMk=sorted.find(function(m){return m.m===rec.market&&m.s===rec.sel;});
    var rEdge=recMk&&recMk.odds&&recMk.p!=null?recMk.p-1/recMk.odds:null;
    var negE=rEdge!=null&&rEdge<0;
    var isW=rec.conf==='观望'||r.gate==='skip';
    h+='<div class="slip"><div class="slip-bar"></div>';
    h+='<div style="font-size:10px;letter-spacing:.25em;color:#54678C">BET SLIP · 结论</div>';
    if(negE){
      h+='<div style="font-size:20px;font-weight:900;color:#F87171;margin:8px 0 4px">⛔ 推荐被拦截</div>';
      h+='<div style="font-size:12.5px;color:#8CA0C0">AI推荐 '+esc(rec.market)+'·'+esc(rec.sel)+' 但edge为 <b style="color:#F87171">'+(rEdge*100).toFixed(1)+'%</b>(负值),强制修正为观望</div>';
    }else if(isW){
      h+='<div style="font-size:24px;font-weight:900;color:#F87171;margin:8px 0 4px">本场观望</div>';
    }else{
      var cmap={高:'#34D399',中:'#F5B841',低:'#FB923C'};
      var cc=cmap[rec.conf]||'#8CA0C0';
      h+='<div style="font-size:22px;font-weight:900;color:#F5B841;margin:8px 0 4px">'+esc(rec.market)+' · '+esc(rec.sel)+'</div>';
      h+='<div style="display:flex;gap:14px;font-size:12.5px;color:#8CA0C0;margin:4px 0 10px;flex-wrap:wrap">';
      h+='<span>信心 <b style="color:'+cc+'">'+esc(rec.conf)+'</b></span>';
      if(rec.stake)h+='<span>注码 <b style="color:#E6EDF7">'+esc(rec.stake)+'</b></span>';
      h+='</div>';
      // 入场时机
      if(rec.timing){
        var tmap={'赛前投':['#34D399','⏱ 赛前投'],'等升水':['#F5B841','⏳ 等升水'],'观望':['#8CA0C0','👁 观望']};
        var tv=tmap[rec.timing]||['#8CA0C0',rec.timing];
        h+='<div style="padding:8px 10px;background:'+tv[0]+'14;border:1px solid '+tv[0]+'55;border-radius:8px;margin-bottom:10px">';
        h+='<span style="font-size:12.5px;font-weight:800;color:'+tv[0]+'">'+esc(tv[1])+'</span>';
        if(rec.timing_note)h+='<span style="font-size:11.5px;color:#8CA0C0;margin-left:8px">'+esc(rec.timing_note)+'</span>';

  }

  // risks
  if(r.risks&&r.risks.length){
    h+='<div class="card" style="background:transparent;border-style:dashed;margin-top:0"><div style="font-size:11px;color:#54678C;font-weight:700;margin-bottom:6px">⚠ 风险提示</div>';

  if(ST.reportOpen){
    h+='<div style="margin-top:10px"><pre style="background:#0E1626;border:1px solid #1E2A44;border-radius:10px;padding:14px;font-size:11.5px;color:#8CA0C0;white-space:pre-wrap;word-break:break-word;font-family:monospace;line-height:1.7;max-height:420px;overflow-y:auto">'+esc(buildReportText(r,home,away,sorted,csa,warns))+'</pre>';
    h+='<div style="text-align:center;margin-top:8px"><button class="btn-s gold" id="rep-copy">复制报告</button></div></div>';

function buildReportText(r,home,away,sorted,csa,warns){
  var pr=r.probs||{},cs=r.consensus||{},g=r.goals||{},mt=r.meta||{},ln=r.lineups||{};
  var L=[];
  L.push('【'+ST.matchLabel+'】分析报告');
  L.push('生成时间:'+new Date().toLocaleString('zh-CN'));
  L.push('开赛:'+(mt.kickoff||'—')+' · 场馆:'+(mt.venue||'—')+' · 天气:'+(mt.weather||'—')+' · 主裁:'+(mt.referee||'—')+(mt.referee_nat?'('+mt.referee_nat+')':''));
  if(ln.home)L.push(home+'首发:'+ln.home);
  if(ln.away)L.push(away+'首发:'+ln.away);
  L.push('');L.push('──动机──');
  var gm={proceed:'清晰',caution:'存疑',skip:'观望'};
  L.push((gm[r.gate]||r.gate)+' · '+(r.gate_note||''));
  var mot=r.motivation||{};
  if(mot.home)L.push(home+':'+mot.home);
  if(mot.away)L.push(away+':'+mot.away);
  if(r.news)L.push('情报:'+r.news);
  L.push('');L.push('──概率──');
  L.push('AI: 主'+pct(pr.home)+' / 平'+pct(pr.draw)+' / 客'+pct(pr.away));
  if(cs.home)L.push('共识('+(cs.source||'?')+'):'+pct(cs.home)+'/'+pct(cs.draw)+'/'+pct(cs.away));
  L.push('进球期望 主'+(g.home_exp||'—')+' 客'+(g.away_exp||'—')+' 大2.5:'+pct(g.over25));
  if(warns.length){L.push('');L.push('──⚠警告──');warns.forEach(function(w){L.push('· '+w.msg);});}
  L.push('');L.push('──盘口扫描──');
  sorted.forEach(function(mk){
    var im=imp(mk.odds),e=(im&&mk.p!=null)?mk.p-im:null;
    L.push(mk.m+'·'+mk.s+' @'+(mk.odds||'—')+' 隐含'+pct(im)+' AI'+pct(mk.p)+' edge'+(e==null?'—':(e>0?'+':'')+(e*100).toFixed(1)+'%'));
  });
  if(r.rec&&r.rec.market){
    L.push('');L.push('──结论──');
    L.push(r.gate==='skip'?'本场观望':r.rec.market+' · '+r.rec.sel);
    L.push('信心:'+r.rec.conf+' · '+r.rec.stake);
    if(r.rec.timing)L.push('入场时机:'+r.rec.timing+(r.rec.timing_note?' — '+r.rec.timing_note:''));
    (r.rec.why||[]).forEach(function(w){L.push('· '+w);});
  }
  if(r.risks&&r.risks.length){L.push('');L.push('──风险──');r.risks.forEach(function(ri){L.push('· '+ri);});}
  L.push('');L.push('分析仅供参考 · 理性投注');
  return L.join('\n');
}

function renderLog(){
  var settled=ST.log.filter(function(b){return b.result!=='pending'&&b.ret!=null;});
  var tS=settled.reduce(function(s,b){return s+b.stake;},0);
  var tR=settled.reduce(function(s,b){return s+b.ret;},0);
  var pl=tR-tS,wins=ST.log.filter(function(b){return b.result==='win';}).length;
  var losses=ST.log.filter(function(b){return b.result==='loss';}).length;
  var roi=tS>0?(pl/tS*100):null;
  var h='<div class="sec">盈亏总览</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">';
  [['净盈亏',(pl>=0?'+':'')+fmtM(pl),pl>=0?'#34D399':'#F87171'],['总投入',fmtM(tS),'#E6EDF7'],['总回收',fmtM(tR),'#E6EDF7'],['命中率',(wins+losses)?Math.round(wins/(wins+losses)*100)+'%':'—','#6FA8F5'],['ROI',roi==null?'—':(roi>=0?'+':'')+roi.toFixed(1)+'%',roi==null?'#8CA0C0':roi>=0?'#34D399':'#F87171']].forEach(function(s){
    h+='<div class="card" style="padding:12px 6px;text-align:center"><div style="font-size:14.5px;font-weight:900;color:'+s[2]+'" class="num">'+esc(s[1])+'</div><div style="font-size:9.5px;color:#54678C;margin-top:3px">'+s[0]+'</div></div>';
  });
  h+='</div><div class="sec">记录</div>';
  if(!ST.log.length){h+='<div class="card" style="text-align:center;padding:36px;color:#54678C">还没有记录</div>';return h;}
  ST.log.forEach(function(b){
    h+='<div class="card" style="margin-bottom:8px;padding:13px">';
    h+='<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px">';
    h+='<div style="font-size:13.5px;font-weight:700">'+esc(b.match)+' <span style="font-size:10.5px;color:#54678C;font-weight:400">'+esc(b.league)+' · '+esc(b.date)+'</span></div>';
    h+='<button class="btn-s red" data-action="del" data-id="'+b.id+'">删除</button></div>';
    h+='<div style="font-size:12.5px;color:#F5B841;margin:5px 0 8px;font-weight:600">'+esc(b.market)+' · '+esc(b.sel)+' <span style="color:#8CA0C0;font-weight:400" class="num">@'+esc(b.odds||'—')+' · $'+esc(b.stake)+'</span></div>';
    if(b.result==='pending'){
      h+='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">';
      h+='<button class="btn-s green" data-action="win" data-id="'+b.id+'">赢</button>';
      h+='<button class="btn-s red" data-action="loss" data-id="'+b.id+'">输</button>';
      h+='<button class="btn-s" data-action="push" data-id="'+b.id+'">走水</button>';
      h+='<span style="font-size:11px;color:#54678C">Cash Out→</span>';
      h+='<input type="number" placeholder="实收$" class="inp" style="width:78px;padding:5px 8px;font-size:12px" data-cashout="'+b.id+'">';
      h+='</div>';
    }else{
      var rc={win:'#34D399',loss:'#F87171',push:'#8CA0C0',cashout:'#F5B841'}[b.result];
      var rl={win:'✓ 赢',loss:'✗ 输',push:'− 走水',cashout:'⇄ Cash Out'}[b.result];
      h+='<div style="display:flex;justify-content:space-between;align-items:center">';
      h+='<span style="font-size:12px;font-weight:700;color:'+rc+'">'+rl+' <span style="color:#8CA0C0;font-weight:400" class="num">回收'+fmtM(b.ret||0)+' 净'+((b.ret||0)-b.stake>=0?'+':'')+fmtM((b.ret||0)-b.stake)+'</span></span>';
      h+='<button class="btn-s" data-action="unsettle" data-id="'+b.id+'">改</button></div>';
    }
    h+='</div>';
  });
  return h;
}

// ── 动作 ──
function refreshResults(){
  var area=document.getElementById('results-area');
  if(!area||!ST.result)return;
  area.innerHTML=renderResults(ST.result);
  area.style.display='';
  var rb=document.getElementById('rec-btn');
  if(rb)rb.addEventListener('click',recordBet);
  var rt=document.getElementById('rep-toggle');
  if(rt)rt.addEventListener('click',function(){ST.reportOpen=!ST.reportOpen;refreshResults();});
  var rc=document.getElementById('rep-copy');
  if(rc)rc.addEventListener('click',function(){
    var sorted=getSorted(ST.result);
    var csa=buildCSA(ST.result.goals&&ST.result.goals.home_exp,ST.result.goals&&ST.result.goals.away_exp,ST.result.correct_scores);
    var warns=getWarnings(ST.result);
    navigator.clipboard.writeText(buildReportText(ST.result,getField('home'),getField('away'),sorted,csa,warns)).then(function(){
      rc.textContent='✓ 已复制';setTimeout(function(){rc.textContent='复制报告';},2000);
    });
  });
}

function refreshLog(){
  var area=document.getElementById('log-area');
  if(area)area.innerHTML=renderLog();
  updateTabLabel();
}

function updateTabLabel(){
  var tabs=document.querySelectorAll('.tab-btn');
  tabs.forEach(function(t){
    if(t.dataset.tab==='log'){t.textContent='🧾 日志'+(ST.log.length?' ('+ST.log.length+')':'');}

function switchTab(tab){
  ST.tab=tab;
  document.getElementById('tab-analyze').style.display=tab==='analyze'?'':'none';
  document.getElementById('tab-log').style.display=tab==='log'?'':'none';
  document.querySelectorAll('.tab-btn').forEach(function(b){b.className='tab-btn'+(b.dataset.tab===tab?' on':'');});
  if(tab==='log')refreshLog();
}

function setLeague(lg){
  ST.league=lg;
  document.querySelectorAll('.chip').forEach(function(c){c.className='chip'+(c.dataset.lg===lg?' on':'');});
}

var statusTimer=null;
function setStatus(msg){
  var el=document.getElementById('status-msg');
  if(el){el.textContent=msg;el.style.display=msg?'':'none';}
}
function setError(msg){
  var el=document.getElementById('error-msg');
  if(el){el.textContent=msg;el.style.display=msg?'':'none';}
}

function analyze(){
  if(!ST.apiKey.trim()){alert('请先填入API Key');return;}
  var home=getField('home'),away=getField('away');
  if(!home||!away){alert('请填写主客队名称');return;}
  var btn=document.getElementById('analyze-btn');
  if(btn){btn.disabled=true;btn.textContent='分析中…';}
  ST.busy=true;ST.statusIdx=0;ST.result=null;ST.reportOpen=false;
  ST.matchLabel=ST.league+' · '+home+' vs '+away;
  setError('');
  document.getElementById('results-area').style.display='none';
  setStatus(STATUS[0]+' (约30-90秒)');
  statusTimer=setInterval(function(){
    ST.statusIdx=(ST.statusIdx+1)%STATUS.length;
    setStatus(STATUS[ST.statusIdx]+' (约30-90秒)');
  },4000);
  runAnalysis(buildPrompt(),function(r){
    clearInterval(statusTimer);setStatus('');
    ST.result=r;ST.busy=false;
    if(r.odds_snapshot&&r.odds_snapshot.home){
      setSnap({home:r.odds_snapshot.home,draw:r.odds_snapshot.draw,away:r.odds_snapshot.away,ts:new Date().toLocaleString('zh-CN')});
    }
    if(btn){btn.disabled=false;btn.textContent='开始分析';}
    refreshResults();
  },function(err){
    clearInterval(statusTimer);setStatus('');ST.busy=false;
    if(btn){btn.disabled=false;btn.textContent='开始分析';}
    setError('分析失败: '+String(err).slice(0,400));
  });
}

function recordBet(){
  var r=ST.result;if(!r||!r.rec)return;
  var sorted=getSorted(r);
  var recMk=sorted.find(function(m){return m.m===r.rec.market&&m.s===r.rec.sel;});
  var home=getField('home'),away=getField('away');
  var entry={id:Date.now(),date:new Date().toISOString().slice(0,10),league:ST.league,match:home+' vs '+away,
    market:r.rec.market,sel:r.rec.sel,odds:recMk&&recMk.odds||null,p:recMk&&recMk.p||null,
    stake:parseFloat((r.rec.stake||'').replace(/[^0-9.]/g,''))||5,ret:null,result:'pending'};
  ST.log.unshift(entry);saveLog();
  switchTab('log');
}

function settleBet(id,res){
  ST.log=ST.log.map(function(b){
    if(b.id!==id)return b;
    var ret=null;
    if(res==='win')ret=b.odds?+(b.stake*b.odds).toFixed(2):null;
    if(res==='loss')ret=0;
    if(res==='push')ret=b.stake;
    return Object.assign({},b,{result:res,ret:ret});
  });
  saveLog();refreshLog();
}

function delBet(id){ST.log=ST.log.filter(function(b){return b.id!==id;});saveLog();refreshLog();}
function unsettleBet(id){ST.log=ST.log.map(function(b){return b.id===id?Object.assign({},b,{result:'pending',ret:null}):b;});saveLog();refreshLog();}

function init(){
  loadLog();

  // League chips
  var lr=document.getElementById('league-row');

    LEAGUES.forEach(function(lg){
      var b=document.createElement('button');

      o.value=c.v;o.textContent=c.l;
      if(c.v==='cup_ko')o.selected=true;
      ctx.appendChild(o);
    });
  }

  // 文件输入监听

  if(imgFile){
    imgFile.addEventListener('change',function(e){
      var files=Array.from(e.target.files||[]);
      e.target.value='';

        compressImg(f,function(img){
          if(ST.images.length<8){ST.images.push(img);refreshImgGrid();}
        });
      });
    });
  }

  // 分析按钮
  var ab=document.getElementById('analyze-btn');
  if(ab)ab.addEventListener('click',analyze);

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click',function(){switchTab(b.dataset.tab);});
  });

  // Key panel toggle
  var kt=document.getElementById('key-toggle');
  if(kt)kt.addEventListener('click',toggleKeyPanel);

  var ki=document.getElementById('key-inp');
  if(ki){
    ki.value=ST.apiKey;
    ki.addEventListener('input',function(){
      ST.apiKey=ki.value;
      localStorage.setItem('vt_key',ki.value);
      updateKeyUI();
    });
  }

  var ks=document.getElementById('key-show');
  if(ks)ks.addEventListener('click',function(){
    ST.keyVisible=!ST.keyVisible;
    var ki2=document.getElementById('key-inp');
    if(ki2)ki2.type=ST.keyVisible?'text':'password';
    ks.textContent=ST.keyVisible?'隐藏':'显示';
  });

  var kc=document.getElementById('key-clear');
  if(kc)kc.addEventListener('click',function(){
    ST.apiKey='';localStorage.removeItem('vt_key');
    var ki2=document.getElementById('key-inp');if(ki2)ki2.value='';
    updateKeyUI();
  });

  // Log event delegation
  document.addEventListener('click',function(e){
    var t=e.target;
    var action=t.dataset.action;
    var id=t.dataset.id?parseInt(t.dataset.id):null;
    if(!action)return;
    if(action==='del'&&id)delBet(id);
    else if(action==='win'&&id)settleBet(id,'win');
    else if(action==='loss'&&id)settleBet(id,'loss');
    else if(action==='push'&&id)settleBet(id,'push');
    else if(action==='unsettle'&&id)unsettleBet(id);
  });

  // Cash out via Enter key
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var co=e.target.dataset.cashout;
    if(co){
      var v=parseFloat(e.target.value);
      if(!isNaN(v)){
        var id=parseInt(co);
        ST.log=ST.log.map(function(b){return b.id===id?Object.assign({},b,{result:'cashout',ret:v}):b;});
        saveLog();refreshLog();
      }
    }
  });

  if(ST.keyPanelOpen)openKeyPanel();
}

function updateKeyUI(){
  var badge=document.getElementById('key-badge');
  var kc=document.getElementById('key-clear');
  if(badge){
    if(ST.apiKey){badge.textContent='✓ API Key已设置 — 分析使用你的Anthropic账户';badge.style.color='#34D399';}
    else{badge.textContent='⚡ 点击设置 Anthropic API Key';badge.style.color='#F5B841';}
  }
  if(kc)kc.style.display=ST.apiKey?'':'none';
}

function toggleKeyPanel(){
  var body=document.getElementById('key-body');
  var arrow=document.getElementById('key-arrow');
  if(!body)return;
  ST.keyPanelOpen=body.style.display==='none';
  body.style.display=ST.keyPanelOpen?'':'none';
  if(arrow)arrow.textContent=ST.keyPanelOpen?'▲':'▼';
}
function openKeyPanel(){
  var body=document.getElementById('key-body');
  var arrow=document.getElementById('key-arrow');
  if(body){body.style.display='';ST.keyPanelOpen=true;}
  if(arrow)arrow.textContent='▲';
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
